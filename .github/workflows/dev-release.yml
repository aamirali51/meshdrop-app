name: Build Dev Pre-Release (Desktop & Mobile)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout meshdrop-app
        uses: actions/checkout@v4
        with:
          path: meshdrop-app

      - name: Checkout meshdrop-core (dependency)
        uses: actions/checkout@v4
        with:
          repository: aamirali51/meshdrop-core
          path: meshdrop-core
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: meshdrop-app/package-lock.json

      - name: Install dependencies
        working-directory: meshdrop-app
        run: npm ci

      - name: Build Electron Desktop Release
        working-directory: meshdrop-app
        shell: bash
        run: |
          npm run build
          npx electron-builder --windows --publish never
          cp dist/latest.yml dist/dev.yml 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-build
          path: |
            meshdrop-app/dist/*.exe
            meshdrop-app/dist/*.yml
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout meshdrop-app
        uses: actions/checkout@v4
        with:
          path: meshdrop-app

      - name: Checkout meshdrop-core (dependency)
        uses: actions/checkout@v4
        with:
          repository: aamirali51/meshdrop-core
          path: meshdrop-core
          ref: dev

      - name: Free Disk Space (Ubuntu Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: meshdrop-app/meshdrop-mobile-rn81/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Engine Dependencies
        working-directory: meshdrop-core
        run: npm ci

      - name: Install Mobile Dependencies
        working-directory: meshdrop-app/meshdrop-mobile-rn81
        run: npm ci

      - name: Bundle Engine Assets
        working-directory: meshdrop-app/meshdrop-mobile-rn81
        run: npm run build:engine

      - name: Configure release signing (keystore from secrets)
        working-directory: meshdrop-app/meshdrop-mobile-rn81/android/app
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MESHDROP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MESHDROP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > meshdrop-release.keystore
            printf 'storeFile=meshdrop-release.keystore\nstorePassword=%s\nkeyAlias=meshdrop\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
            echo "::notice::Release signing configured from secrets"
          else
            echo "::warning::MESHDROP_KEYSTORE_B64 / MESHDROP_KEYSTORE_PASSWORD not set — APK will be signed with the CI debug key"
          fi

      - name: Build Android Release APK
        working-directory: meshdrop-app/meshdrop-mobile-rn81/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Generate Dev Manifest
        working-directory: meshdrop-app/meshdrop-mobile-rn81
        run: |
          node scripts/make-latest-json.js android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/latest.json
        env:
          UPDATE_TAG: dev-preview
          UPDATE_OWNER: aamirali51
          UPDATE_REPO: meshdrop-releases

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: |
            meshdrop-app/meshdrop-mobile-rn81/android/app/build/outputs/apk/release/*.apk
            meshdrop-app/meshdrop-mobile-rn81/android/app/build/outputs/apk/release/latest.json
          if-no-files-found: error

  publish-pre-release:
    name: Publish Dev Pre-Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Desktop Build
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-build
          path: release-assets/desktop

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: android-apk-build
          path: release-assets/mobile

      - name: Create or Update Dev Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-preview
          name: "MeshDrop Dev Preview"
          repository: aamirali51/meshdrop-releases
          body: |
            ## 🧪 MeshDrop Pre-Release / Dev Test Build
            * **Branch:** `dev`
            * **Commit:** `${{ github.sha }}`
            
            ### 📦 Download Test Assets:
            - **Windows PC:** Download the `.exe` installer below
            - **Android Phone:** Download the `.apk` and install on device
            
            > *Note: This is an internal testing build. When verified, it will be merged into `main`.*
          prerelease: true
          draft: false
          files: |
            release-assets/desktop/*.exe
            release-assets/desktop/*.yml
            release-assets/mobile/*.apk
            release-assets/mobile/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
