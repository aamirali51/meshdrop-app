name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create/update the GitHub Release.
permissions:
  contents: write

jobs:
  # Create the GitHub Release ONCE before any build publishes to it. Without
  # this, the three desktop OS jobs race to POST /releases and the losers fail
  # with "Published releases must have a valid tag" (422) — the release was
  # created by a peer job a moment earlier. Creating it here (draft) means
  # every later upload just updates it, and the final unpublish step flips it
  # live only after everything succeeded.
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create as a draft first so uploads from the build jobs can land
          # before it becomes visible. If it already exists (re-run), reuse it.
          if ! gh release view "$TAG" --repo aamirali51/meshdrop-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo aamirali51/meshdrop-releases \
              --title "$TAG" --draft --generate-notes || true
          else
            echo "release $TAG already exists — reusing"
          fi

  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      # electron-builder publish config reads these (electron-builder.yml).
      # Update FEEDS must always point at the PUBLIC meshdrop-releases repo —
      # the app source repo is private, and anonymous updater fetches only work
      # against public releases. (Publishing the artifacts there requires a
      # RELEASES token with write access to aamirali51/meshdrop-releases.)
      GH_UPDATE_OWNER: aamirali51
      GH_UPDATE_REPO: meshdrop-releases
      # Portable update signing key (ed25519 private half). Empty when the
      # secret isn't configured; the signing step skips in that case.
      MESHDROP_UPDATE_KEY: ${{ secrets.MESHDROP_UPDATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout meshdrop-core (sibling)
        run: git clone --depth 1 https://github.com/aamirali51/meshdrop-core.git ../meshdrop-core

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          # No codesigning certs in CI: don't attempt autodiscovery (macOS).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Portable builds refuse unsigned updates (ed25519, fail-closed). Sign
      # the portable artifacts and attach the .sig files to the release. The
      # private key must match the public key embedded in
      # electron/updater-util.js. NSIS-installed updates (electron-updater)
      # don't need signatures.
      - name: Sign portable artifacts & publish release
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          if [ -n "$MESHDROP_UPDATE_KEY" ]; then
            for f in dist/*portable.exe dist/*.zip; do
              node scripts/sign-update.js "$f"
            done
            sigs=(dist/*.sig)
            if [ ${#sigs[@]} -gt 0 ]; then
              gh release upload "$TAG" "${sigs[@]}" --clobber --repo aamirali51/meshdrop-releases
            fi
          fi
          # Do NOT flip the release live here — the publish-release job does
          # that after every platform (desktop + android) has uploaded.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}

      - name: Warn when portable signing key is missing
        if: runner.os == 'Windows' && env.MESHDROP_UPDATE_KEY == ''
        shell: bash
        run: echo "::warning::MESHDROP_UPDATE_KEY secret not set — portable self-updates will be unsigned (refused). NSIS installer updates still work."

  # Build & publish the store-free Android APK + latest.json manifest that the
  # in-app updater checks. Deliberately depends on the desktop `release` job so
  # the GitHub Release already exists before we upload the APK to it. Android
  # artifacts are only relevant on version tags.
  android:
    name: Build & publish Android APK
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')

    env:
      # ed25519 signing key for release provenance (.sig); optional.
      MESHDROP_UPDATE_KEY: ${{ secrets.MESHDROP_UPDATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout meshdrop-core (sibling)
        run: git clone --depth 1 https://github.com/aamirali51/meshdrop-core.git ../meshdrop-core

      - name: Free Disk Space (Ubuntu Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24: the bare-module-lexer prebuild (pulled by bare-pack for the
          # engine bundle) requires node_api_is_sharedarraybuffer, which Node 20
          # lacks ("symbol lookup error"). Desktop jobs can stay on 20 — they
          # never run bare-pack.
          node-version: 24
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install engine dependencies
        working-directory: ../meshdrop-core
        run: npm ci

      - name: Install mobile dependencies
        working-directory: meshdrop-mobile-rn81
        run: npm ci

      - name: Build engine bundle
        working-directory: meshdrop-mobile-rn81
        # bare-pack ships the android-arm64 engine prebuilds into APK assets.
        run: npm run build:engine

      - name: Configure release signing (keystore from secrets)
        working-directory: meshdrop-mobile-rn81/android/app
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MESHDROP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MESHDROP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > meshdrop-release.keystore
            printf 'storeFile=meshdrop-release.keystore\nstorePassword=%s\nkeyAlias=meshdrop\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
            echo "::notice::Release signing configured from secrets"
          else
            echo "::warning::MESHDROP_KEYSTORE_B64 / MESHDROP_KEYSTORE_PASSWORD not set — APK will be signed with the CI debug key"
          fi

      - name: Assemble release APK
        working-directory: meshdrop-mobile-rn81/android
        # arm64-v8a only: matches the engine prebuilds and keeps CI tractable.
        run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify release APK is signed with the MeshDrop release key
        working-directory: meshdrop-mobile-rn81/android
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # SDK layout varies per runner: pick the newest build-tools apksigner.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
             | grep -qF "CN=MeshDrop Mobile"; then
            echo "APK signed with the MeshDrop release key"
          else
            echo "::error::APK is NOT signed with the MeshDrop release key — check MESHDROP_KEYSTORE_B64 / MESHDROP_KEYSTORE_PASSWORD"
            [ -z "$APKSIGNER" ] && echo "::warning::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

      - name: Attach APK, signature & manifest to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          APK=meshdrop-mobile-rn81/android/app/build/outputs/apk/release/app-release.apk
          VER=$(grep -oP '(?<=^versionName=).*' meshdrop-mobile-rn81/version.properties)
          NAME="MeshDrop-${VER}.apk"
          # Generate the manifest against the renamed asset so its download URL
          # matches the file that actually lands on the release.
          cp "$APK" "$NAME"
          node meshdrop-mobile-rn81/scripts/make-latest-json.js "$NAME" meshdrop-mobile-rn81/latest.json
          if [ -n "$MESHDROP_UPDATE_KEY" ]; then
            node scripts/sign-update.js "$NAME"
            gh release upload "$TAG" "$NAME" "$NAME.sig" \
              meshdrop-mobile-rn81/latest.json --clobber \
              --repo aamirali51/meshdrop-releases
          else
            gh release upload "$TAG" "$NAME" meshdrop-mobile-rn81/latest.json --clobber \
              --repo aamirali51/meshdrop-releases
          fi

      - name: Warn when mobile signing key is missing
        if: env.MESHDROP_UPDATE_KEY == ''
        shell: bash
        run: echo "::warning::MESHDROP_UPDATE_KEY secret not set — Android APK published without an ed25519 .sig provenance file. In-app integrity still enforced via manifest sha256 + Android's signature match."

  # Final gate: flip the draft release live only after EVERY platform
  # (windows/mac/linux desktop + android) has uploaded its artifacts. This
  # guarantees the release is never visible half-populated, and ordering is
  # strictly: prepare (create) → desktop (windows/mac/linux) → android → live.
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release, android]
    if: startsWith(github.ref, 'refs/tags/v') && always()
    steps:
      - name: Flip release live
        if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" --draft=false --repo aamirali51/meshdrop-releases
          echo "Release $TAG published."
      - name: Fail if any platform failed
        if: ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A platform build failed — release left as draft."
          exit 1

