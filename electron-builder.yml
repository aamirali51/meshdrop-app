# electron-builder configuration for MeshDrop
#
# Release pipeline:
#   npm run build:pack    -> local packaged app (no publish)
#   npm run build:release -> package + upload to GitHub Releases (needs
#                            GH_UPDATE_OWNER, GH_UPDATE_REPO and a
#                            GH_TOKEN / GITHUB_TOKEN with repo access)

appId: com.meshdrop.desktop
productName: MeshDrop
copyright: Copyright © 2026 MeshDrop

directories:
  output: dist
  buildResources: build

# Artifact naming: MeshDrop-1.0.0-win-x64.exe, MeshDrop-1.0.0-mac-x64.dmg,
# MeshDrop-1.0.0-linux-x64.AppImage
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# GitHub Releases publish target. Owner/repo are inferred from the
# `repository` field in package.json, so no env vars are needed to build
# locally; upload auth comes from the standard GH_TOKEN / GITHUB_TOKEN.
publish:
  provider: github
  owner: aamirali51
  repo: meshdrop-releases
  releaseType: release

files:
  - electron/**/*
  - core/**/*
  - src/shared/**/*
  # renderer/dist is gitignored; electron-builder honors .gitignore even for
  # paths listed in `files`, so the built UI was silently dropped from the
  # package (app crashed on launch with no renderer). The `!` re-includes it.
  - '!renderer/dist/**/*'
  - renderer/dist/**/*
  - build/**/*
  - package.json

# Bundled LGPL ffmpeg/ffprobe for watch-party remux (stream-copy + AAC). Copied
# outside the asar to <resources>/ffmpeg/<platform>/ where electron/remux.js
# resolves them (process.resourcesPath). Populated by scripts/fetch-ffmpeg.js
# (pinned releases, SHA-256 verified); CI fetches before every release build.
# Without them the app still works — negotiation degrades to direct/refuse.
extraResources:
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

# The P2P engine (@mesh/core) uses native/prebuilt modules (sodium-native,
# udx-native) that cannot load from inside asar, so node_modules stays
# unpacked on disk.
asarUnpack:
  - '**/node_modules/**'

# Prebuilt bare-runtime modules must not be rebuilt by electron-builder.
npmRebuild: false

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  include: installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

# Portable single-file exe keeps the generic artifact pattern
# (MeshDrop-<version>-win-x64.exe).
portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target:
    - dmg
  category: public.app-category.utilities
  icon: build/icon.icns

linux:
  target:
    - AppImage
  category: Network
  icon: build/icon.png
